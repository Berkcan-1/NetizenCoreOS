[package]
name = "nc-package-installer"
version = "1.0.0"
edition = "2021"

[dependencies]
nc-abi = { path = "../../../../crates/foundation/nc-abi" }
nc-app-sdk = { path = "../../../../crates/runtime/nc-app-sdk" }
nc-brand = { path = "../../../runtime/nc-brand" }
nc-caps = { path = "../../../../crates/runtime/nc-caps", default-features = false }

[workspace]

[profile.release]
panic = "abort"
opt-level = "z"
lto = false
codegen-units = 1
debug = false
strip = "symbols"
