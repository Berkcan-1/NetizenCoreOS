[package]
name = "nc-files-v8a"
version = "0.1.0"
edition = "2021"

[dependencies]
nc-abi = { path = "../../../../crates/foundation/nc-abi" }
nc-app-sdk = { path = "../../../../crates/runtime/nc-app-sdk" }

# Ana workspace'ten ayrı: bu ikili build.sh ile (aarch64-unknown-none) derlenir ve .ntzc olarak paketlenir.
[workspace]

[profile.release]
panic = "abort"
opt-level = "z"
lto = false
codegen-units = 1
debug = false
strip = "symbols"
