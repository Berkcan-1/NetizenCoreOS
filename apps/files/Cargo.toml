[package]
name = "nc-files-r3"
version = "0.1.0"
edition = "2021"

[dependencies]
nc-abi = { path = "../../crates/nc-abi" }
nc-app = { path = "../../crates/nc-app" }
nc-app-sdk = { path = "../../crates/nc-app-sdk" }
nc-app-host = { path = "../../crates/nc-app-host" }
# Dosyalar Ring 3'te: yerleşik Ring 0 örnekleri DERLENMEZ, nc_fs = VFS hizmeti istemcisi.
nc-app-files = { path = "../../crates/nc-app-files", default-features = false }
nc-fs-facade = { path = "../../crates/nc-fs-facade", default-features = false, features = ["client"] }

[workspace]

[profile.release]
panic = "abort"
opt-level = "z"
lto = false
codegen-units = 1
debug = false
strip = "symbols"
