[package]
name = "nc-settings-r3"
version = "0.1.0"
edition = "2021"

[dependencies]
nc-abi = { path = "../../../crates/foundation/nc-abi" }
nc-app = { path = "../../../crates/ui/nc-app" }
nc-app-sdk = { path = "../../../crates/runtime/nc-app-sdk" }
nc-app-host = { path = "../../../crates/runtime/nc-app-host" }
nc-gfx = { path = "../../../crates/graphics/nc-gfx" }
nc-app-settings = { path = "../nc-app-settings", default-features = false }
nc-fs-facade = { path = "../../../crates/runtime/nc-fs-facade", default-features = false, features = ["client"] }
nc-sys-facade = { path = "../../../crates/runtime/nc-sys-facade", default-features = false, features = ["client"] }

[workspace]

[profile.release]
panic = "abort"
opt-level = "z"
lto = false
codegen-units = 1
debug = false
strip = "symbols"
