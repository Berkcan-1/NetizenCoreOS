[package]
name = "nc-browser-r3"
version = "0.1.0"
edition = "2021"

[dependencies]
nc-abi = { path = "../../../crates/foundation/nc-abi" }
nc-app = { path = "../../../crates/ui/nc-app" }
nc-app-sdk = { path = "../../../crates/runtime/nc-app-sdk" }
nc-app-host = { path = "../../../crates/runtime/nc-app-host" }
nc-app-browser = { path = "../nc-app-browser", default-features = false }
nc-net-facade = { path = "../../../crates/runtime/nc-net-facade", default-features = false, features = ["client"] }

[workspace]

[profile.release]
panic = "abort"
opt-level = "z"
lto = false
codegen-units = 1
debug = false
strip = "symbols"
