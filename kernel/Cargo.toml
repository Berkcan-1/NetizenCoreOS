[package]
name = "nc-kernel"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

[features]
default = []
kernel-paging = []
ring3-apps = ["dep:nc-abi", "dep:nc-elf", "dep:nc-app", "dep:nc-pkg", "dep:nc-app-host", "nc-ui/remote"]
qemu = ["dep:nc-platform-qemu"]
generic = ["dep:nc-platform-generic"]

[dependencies]
nc-hal = { path = "../crates/nc-hal" }
nc-caps = { path = "../crates/nc-caps" }
nc-driver = { path = "../crates/nc-driver" }
nc-arch = { path = "../crates/nc-arch" }
nc-math = { path = "../crates/nc-math" }
nc-mem = { path = "../crates/nc-mem" }
nc-abi = { path = "../crates/nc-abi", optional = true }
nc-elf = { path = "../crates/nc-elf", optional = true }
nc-app = { path = "../crates/nc-app", optional = true }
nc-pkg = { path = "../crates/nc-pkg", optional = true }
nc-app-host = { path = "../crates/nc-app-host", optional = true }
nc-fs = { path = "../crates/nc-fs" }
nc-fs-facade = { path = "../crates/nc-fs-facade", features = ["kernel"] }
nc-net = { path = "../crates/nc-net" }
nc-gfx = { path = "../crates/nc-gfx" }
nc-ui = { path = "../crates/nc-ui" }
nc-splash = { path = "../crates/nc-splash" }
nc-setup = { path = "../crates/nc-setup" }
nc-desktop = { path = "../crates/nc-desktop" }
nc-apps = { path = "../crates/nc-apps" }
nc-input = { path = "../crates/nc-input" }
nc-storage = { path = "../crates/nc-storage" }
nc-platform-qemu = { path = "../crates/nc-platform-qemu", optional = true }
nc-platform-generic = { path = "../crates/nc-platform-generic", optional = true }