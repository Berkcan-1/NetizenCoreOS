[package]
name = "nc-kernel"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
bench = false

[features]
default = ["ring3-apps"]
kernel-paging = []
audio-selftest = []
ring3-apps = ["dep:nc-abi", "dep:nc-elf", "dep:nc-app", "dep:nc-pkg", "dep:nc-app-host", "dep:nc-sys-facade", "dep:nc-inflate", "nc-ui/remote"]
ring0-fallback = ["nc-apps/ring0-fallback"]
qemu = ["dep:nc-platform-qemu"]
generic = ["dep:nc-platform-generic"]

[dependencies]
nc-hal = { path = "../crates/foundation/nc-hal" }
nc-spark-sec = { path = "../crates/foundation/nc-spark-sec" }
nc-caps = { path = "../crates/runtime/nc-caps" }
nc-driver = { path = "../crates/hardware/nc-driver" }
nc-arch = { path = "../crates/hardware/nc-arch" }
nc-math = { path = "../crates/foundation/nc-math" }
nc-mem = { path = "../crates/services/nc-mem" }
nc-abi = { path = "../crates/foundation/nc-abi", optional = true }
nc-elf = { path = "../crates/runtime/nc-elf", optional = true }
nc-app = { path = "../crates/ui/nc-app", optional = true }
nc-pkg = { path = "../crates/runtime/nc-pkg", optional = true }
nc-app-host = { path = "../crates/runtime/nc-app-host", optional = true }
nc-sys-facade = { path = "../crates/runtime/nc-sys-facade", optional = true }
nc-inflate = { path = "../crates/foundation/nc-inflate", optional = true }
nc-fs = { path = "../crates/services/nc-fs" }
nc-fs-facade = { path = "../crates/runtime/nc-fs-facade", features = ["kernel"] }
nc-net = { path = "../crates/services/nc-net" }
nc-gfx = { path = "../crates/graphics/nc-gfx" }
nc-audio = { path = "../crates/graphics/nc-audio" }
nc-ui = { path = "../crates/ui/nc-ui" }
nc-splash = { path = "../crates/ui/nc-splash" }
nc-setup = { path = "../crates/ui/nc-setup" }
nc-desktop = { path = "../crates/ui/nc-desktop" }
nc-apps = { path = "../apps/registry/nc-apps", default-features = false }
nc-input = { path = "../crates/hardware/nc-input" }
nc-storage = { path = "../crates/hardware/nc-storage" }
nc-platform-qemu = { path = "../crates/hardware/nc-platform-qemu", optional = true }
nc-platform-generic = { path = "../crates/hardware/nc-platform-generic", optional = true }