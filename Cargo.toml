[workspace]
resolver = "2"
members = [
"kernel",
    "crates/nc-hal",
    "crates/nc-caps",
    "crates/nc-driver",
    "crates/nc-arch",
    "crates/nc-math",
    "crates/nc-mem",
    "crates/nc-abi",
    "crates/nc-app-sdk",
    "crates/nc-app-host",
    "crates/nc-fs-facade",
    "crates/nc-r3-stopwatch",
    "crates/nc-elf",
    "crates/nc-assets",
    "crates/nc-media",
    "crates/nc-gfx",
    "crates/nc-font",
    "crates/nc-ui",
    "crates/nc-splash",
    "crates/nc-setup",
    "crates/nc-input",
    "crates/nc-storage",
    "crates/nc-fs",
    "crates/nc-net",
    "crates/nc-pkg",
    "crates/nc-desktop",
    "crates/nc-app",
    "crates/nc-app-files",
    "crates/nc-uefi",
    "crates/nc-js",
    "crates/nc-app-browser",
    "crates/nc-app-settings",
    "crates/nc-app-system",
    "crates/nc-app-stopwatch",
    "crates/nc-apps",
    "crates/nc-platform-qemu",
    "crates/nc-platform-generic",
]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
codegen-units = 1
debug = false
