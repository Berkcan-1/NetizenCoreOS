[package]
name = "nc-app-files"
version = "0.1.0"
edition = "2021"

# `builtin-instances`: paketten "nc.settings/nc.system/nc.stopwatch" kurulurken Ring 0 örneklerini bağlar. Ring 3
# Dosyalar bunları DERLEMEZ (Ayarlar'ın sürücü bağımlılıkları Ring 3 imajına girmesin).
[features]
default = ["builtin-instances", "kernel-fs"]
builtin-instances = ["dep:nc-app-settings", "dep:nc-app-system", "dep:nc-app-stopwatch"]
kernel-fs = ["nc-fs/kernel"]

[dependencies]
nc-app = { path = "../nc-app" }
nc-gfx = { path = "../nc-gfx" }
nc-font = { path = "../nc-font" }
nc-ui = { path = "../nc-ui" }
nc-pkg = { path = "../nc-pkg" }
# `nc_fs` adı cepheyi gösterir: çekirdek derlemesinde gerçek nc-fs, Ring 3 derlemesinde VFS hizmeti istemcisi.
nc-fs = { package = "nc-fs-facade", path = "../nc-fs-facade", default-features = false }
nc-app-settings = { path = "../nc-app-settings", optional = true }
nc-app-system = { path = "../nc-app-system", optional = true }
nc-app-stopwatch = { path = "../nc-app-stopwatch", optional = true }
nc-media = { path = "../nc-media" }
