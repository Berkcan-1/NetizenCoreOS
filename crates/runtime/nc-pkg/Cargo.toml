[package]
name = "nc-pkg"
version = "0.1.0"
edition = "2021"

[dependencies]
nc-app = { path = "../../ui/nc-app" }
nc-caps = { path = "../nc-caps" }
nc-abi = { path = "../../foundation/nc-abi" }
nc-elf = { path = "../nc-elf" }
nc-crypto = { path = "../../foundation/nc-crypto" }
nc-spark-sec = { path = "../../foundation/nc-spark-sec" }
# Ed25519 signature verification (audited RustCrypto/dalek, no_std).
# SHA-256 is exclusively provided by the SPARK Ada Security Core via `nc-crypto`.
ed25519-dalek = { version = "2.1", default-features = false }

[dev-dependencies]
nc-gfx = { path = "../../graphics/nc-gfx" }
