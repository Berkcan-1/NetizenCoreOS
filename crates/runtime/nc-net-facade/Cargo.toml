[package]
name = "nc-net-facade"
version = "0.1.0"
edition = "2021"

[features]
default = ["kernel"]
kernel = ["dep:nc-net"]
client = ["dep:nc-abi", "dep:nc-app-sdk"]

[dependencies]
nc-net = { path = "../../services/nc-net", optional = true }
nc-abi = { path = "../../foundation/nc-abi", optional = true }
nc-app-sdk = { path = "../nc-app-sdk", optional = true }
