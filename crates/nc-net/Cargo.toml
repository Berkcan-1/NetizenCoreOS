[package]
name = "nc-net"
version = "0.1.0"
edition = "2021"

# crates/nc-net/Cargo.toml
[dependencies]
nc-hal = { path = "../nc-hal" }
nc-arch = { path = "../nc-arch" }
nc-mem = { path = "../nc-mem" }
nc-driver = { path = "../nc-driver" }

# Gerçek TLS 1.3 için no_std kripto primitifleri:
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
x25519-dalek = { version = "2.0", default-features = false, features = ["static_secrets"] }
sha2 = { version = "0.10", default-features = false, features = ["force-soft", "oid"] }
hkdf = { version = "0.12", default-features = false }

# Sunucu kimlik doğrulaması (src/tls_verify.rs). İmza matematiği elle yazılmadı; denetlenmiş RustCrypto
# kütüphaneleri kullanılıyor. Hepsi no_std + alloc ile çalışır.
rsa = { version = "0.9", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa"] }
# Mozilla kök sertifika deposu (TrustAnchor listesi).
webpki-roots = "0.26"
